<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>3D Model Showcase — Popup Viewer</title>

  <style>
    :root {
      --bg:#0f1724;
      --card:#0b1220;
      --accent:#06b6d4;
      --text:#e6eef6;
    }

    * { box-sizing:border-box; }

    body {
      margin:0;
      font-family:Inter,system-ui,Arial,sans-serif;
      background:#DCD;
      color:var(--text);
      min-height:100vh;
      display:flex;
      flex-direction:column;
    }

    header, footer {
      padding:18px 24px;
      background:#000;
      backdrop-filter:blur(4px);
    }

    header {
      display:flex;
      align-items:center;
      justify-content:space-between;
      height:75px;
    }

    header h1 {
      margin:0;
      font-size:1.1rem;
    }

    .container {
      width:100%;
      max-width:1200px;
      margin:28px auto;
      padding:0 18px;
    }

    /* GRID: Desktop = 3 cards, Mobile = 2 cards */
    .grid {
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:18px;
    }

    /* Mobile = 2 cards */
    @media(max-width:720px) {
      .grid {
        grid-template-columns:repeat(2,1fr);
      }
    }

    /* CARD BASE */
    .card {
      background:#EDEFF2;
      color:midnightblue;
      border-radius:10px;
      overflow:hidden;
      cursor:pointer;
      transition:.18s ease;
      padding-bottom:8px;
      text-align:center;
      position:relative;
    }

    .card:hover {
      transform:translateY(-6px);
      box-shadow:0 10px 30px rgba(2,6,23,.6);
    }

    .thumb {
      width:100%;
      height:200px;
      object-fit:cover;
    }

    .card-body {
      padding:12px 10px;
    }

    .card-body h3 {
      margin:6px 0;
      font-size:1.1rem;
      font-weight:700;
      text-align:center;
    }

    /* Click to view — hidden by default */
    .card-body .meta {
      opacity:0;
      transform:translateY(6px);
      transition:opacity .25s ease, transform .25s ease;
      font-size:0.85rem;
      color:#333;
      text-align:center;
    }

    /* visible on hover */
    .card:hover .meta {
      opacity:1;
      transform:translateY(0);
    }

    /* =============================
        MODAL + RESPONSIVE BEHAVIOR
       ============================= */

    .overlay {
      position:fixed;
      inset:0;
      background:rgba(2,6,23,0.65);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:1200;
      padding:20px;
    }

    .overlay.open { display:flex; }

    .modal {
      width:100%;
      max-width:1100px;
      background:#DEF;
      border-radius:12px;
      overflow:hidden;
      display:grid;
      grid-template-columns:1fr 420px;
      min-height:60vh;
      position:relative;
    }

    @media(max-width:1024px){
      .modal {
        grid-template-columns:1fr 360px;
        max-height:90vh;
      }
    }

    @media(max-width:720px) {
      .modal {
        grid-template-columns:1fr;
        grid-template-rows:auto auto;
        width:100%;
        max-width:95%;
        height:auto;
        max-height:95vh;
        overflow-y:auto;
      }
    }

    .viewer {
      position:relative;
      background:#fff !important;
    }

    .viewer canvas {
      width:100%;
      height:100%;
      background:#fff !important;
      display:block;
    }

    .loader-wrap {
      position:absolute;
      inset:0;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      background:#fff;
      z-index:20;
      transition:opacity .4s ease;
    }

    .loader-bar {
      width:60%;
      height:6px;
      background:#ddd;
      border-radius:4px;
      overflow:hidden;
      margin-top:10px;
    }

    .loader-bar-fill {
      height:100%;
      width:0;
      background:#06b6d4;
      transition:width .2s ease;
    }

    .loader-text {
      color:#333;
      font-size:15px;
      margin-top:6px;
    }

    .loader-hidden {
      opacity:0;
      pointer-events:none;
    }

    /* Rotate hint */
    .rotate-hint {
      position:absolute;
      left:50%;
      bottom:28px;
      transform:translateX(-50%);
      padding:8px 14px;
      background:rgba(255,255,255,0.92);
      border-radius:8px;
      font-size:14px;
      color:#222;
      box-shadow:0 6px 18px rgba(0,0,0,0.12);
      opacity:0;
      transition:opacity .35s ease;
      z-index:25;
      pointer-events:none;
    }

    .rotate-hint.show { opacity:1; }

    .info {
      padding:18px;
      display:flex;
      flex-direction:column;
      gap:12px;
      color:#000;
    }

    .close {
      position:absolute;
      right:12px;
      top:12px;
      background:transparent;
      border:none;
      color:#000;
      font-size:22px;
      cursor:pointer;
    }

    /* ===========================
       ENV BUTTONS — ANIMATIONS
       =========================== */

    .env-buttons {
      display:flex;
      gap:8px;
      margin-top:10px;
    }

    .env-buttons button {
      flex:1;
      padding:10px 12px;
      border:none;
      background:#ddd;
      color:#222;
      border-radius:6px;
      cursor:pointer;
      font-size:15px;
      font-weight:500;
      transition:background .25s, transform .25s, box-shadow .25s;
    }

    .env-buttons button:hover {
      background:var(--accent);
      color:white;
      transform:translateY(-3px);
      box-shadow:0 6px 18px rgba(6,182,212,0.45);
      animation:envPulse .9s ease-out forwards;
    }

    @keyframes envPulse {
      0% { box-shadow:0 0 0 rgba(6,182,212,0); }
      50% { box-shadow:0 0 15px rgba(6,182,212,0.5); }
      100% { box-shadow:0 0 0 rgba(6,182,212,0); }
    }

    .env-buttons button.active {
      background:var(--accent);
      color:white;
      transform:translateY(-3px);
      box-shadow:0 6px 18px rgba(6,182,212,0.45);
    }
  </style>
</head>

<body>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js",
    "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/"
  }
}
</script>

<header>
  <h1>3D Model Showcase</h1>
</header>

<main class="container">
  <section class="grid" id="model-grid"></section>
</main>

<footer>
  <div class="container" style="display:flex;align-items:center;justify-content:space-between">
    <span>© Your Studio — 2025</span>
    <span>Built with Three.js</span>
  </div>
</footer>

<!-- MODAL -->
<div class="overlay" id="modal-overlay">
  <div class="modal">
    <div class="viewer" id="viewer">

      <div class="loader-wrap" id="loader">
        <div class="loader-bar"><div class="loader-bar-fill" id="loader-fill"></div></div>
        <div class="loader-text" id="loader-text">Loading 0%</div>
      </div>

      <div id="rotate-hint" class="rotate-hint">Drag to rotate</div>
      <button class="close" id="close-btn">✕</button>
    </div>

    <aside class="info">
      <h2 id="info-title"></h2>
      <p id="info-desc"></p>

      <div class="env-buttons">
        <button data-env="studio">Studio</button>
        <button data-env="day">Day</button>
        <button data-env="night">Night</button>
      </div>
    </aside>
  </div>
</div>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/examples/jsm/loaders/GLTFLoader.js";
import { OrbitControls } from "three/examples/jsm/controls/OrbitControls.js";
import { RGBELoader } from "three/examples/jsm/loaders/RGBELoader.js";

/* models */
const models = [
  { id:1, title:'Vintage Camera', model:'./models/flowervase.glb', thumbnail:'thumbnails/flower.jpg', description:'A stylized vintage camera.' },
  { id:2, title:'Sci-Fi Helmet', model:'./models/mobile_phone.glb', thumbnail:'thumbnails/phone.jpg', description:'Helmet with emissive visor.' },
  { id:3, title:'Mechanical Arm', model:'./models/street_stall.glb', thumbnail:'thumbnails/food.jpg', description:'Robotic arm with joints.' },
  { id:1, title:'Vintage Camera', model:'./models/flowervase.glb', thumbnail:'thumbnails/flower.jpg', description:'A stylized vintage camera.' },
  { id:2, title:'Sci-Fi Helmet', model:'./models/mobile_phone.glb', thumbnail:'thumbnails/phone.jpg', description:'Helmet with emissive visor.' },
  { id:3, title:'Mechanical Arm', model:'./models/street_stall.glb', thumbnail:'thumbnails/food.jpg', description:'Robotic arm with joints.' }
];

const grid = document.getElementById("model-grid");
const overlay = document.getElementById("modal-overlay");
const viewerEl = document.getElementById("viewer");
const closeBtn = document.getElementById("close-btn");
const infoTitle = document.getElementById("info-title");
const infoDesc = document.getElementById("info-desc");
const loaderWrap = document.getElementById("loader");
const loaderFill = document.getElementById("loader-fill");
const loaderText = document.getElementById("loader-text");
const rotateHint = document.getElementById("rotate-hint");

let renderer, scene, camera, controls, currentModel, animId;

const rgbeLoader = new RGBELoader();
const ro = new ResizeObserver(() => resizeRenderer());

const environments = {
  studio:"env/studio.hdr",
  day:"env/day.hdr",
  night:"env/night.hdr"
};

/* Build grid */
models.forEach(m => {
  const card = document.createElement("article");
  card.className = "card";
  card.innerHTML = `
    <img class="thumb" src="${m.thumbnail}">
    <div class="card-body">
      <h3>${m.title}</h3>
      <div class="meta">Click to view</div>
    </div>
  `;
  card.onclick = () => openModal(m.id);
  grid.appendChild(card);
});

function loadEnvironment(hdr){
  rgbeLoader.load(hdr, texture=>{
    texture.mapping = THREE.EquirectangularReflectionMapping;
    scene.environment = texture;
    scene.background = new THREE.Color(0xffffff);
  });
}

function openModal(id){
  const meta = models.find(x => x.id === id);
  overlay.classList.add("open");
  infoTitle.textContent = meta.title;
  infoDesc.textContent = meta.description;
  setTimeout(()=>initViewer(meta),50);
}

function initViewer(meta){
  if(renderer){
    renderer.dispose();
    renderer.domElement.remove();
  }

  loaderWrap.classList.remove("loader-hidden");
  loaderFill.style.width = "0%";
  loaderText.textContent = "Loading 0%";

  renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(viewerEl.clientWidth, viewerEl.clientHeight);
  renderer.setClearColor(0xffffff,1);
  viewerEl.appendChild(renderer.domElement);

  scene = new THREE.Scene();
  scene.background = new THREE.Color(0xffffff);

  camera = new THREE.PerspectiveCamera(45, viewerEl.clientWidth/viewerEl.clientHeight, 0.1, 1000);

  scene.add(new THREE.HemisphereLight(0xffffff,0xaaaaaa,0.6));
  const dir = new THREE.DirectionalLight(0xffffff,1);
  dir.position.set(4,10,6);
  scene.add(dir);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.addEventListener("start", () => rotateHint.classList.remove("show"));

  new GLTFLoader().load(
    meta.model,
    (gltf)=>{
      currentModel = gltf.scene;
      scene.add(currentModel);
      fitModel(currentModel);
      setTimeout(()=>{
        loaderWrap.classList.add("loader-hidden");
        showRotateHintAfterLoad();
      },200);
    },
    (xhr)=>{
      if(xhr.total){
        let p = (xhr.loaded / xhr.total) * 100;
        loaderFill.style.width = p + "%";
        loaderText.textContent = `Loading ${Math.round(p)}%`;
      }
    }
  );

  loadEnvironment(environments.studio);

  document.querySelectorAll(".env-buttons button").forEach(b => b.classList.remove("active"));
  document.querySelector('.env-buttons button[data-env="studio"]').classList.add("active");

  document.querySelectorAll(".env-buttons button").forEach(btn=>{
    btn.onclick = () => {
      loadEnvironment(environments[btn.dataset.env]);
      document.querySelectorAll(".env-buttons button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
    };
  });

  ro.observe(viewerEl);
  animate();
}

function showRotateHintAfterLoad(){
  rotateHint.textContent =
    /Mobi|Android/i.test(navigator.userAgent) ?
    "Tap to rotate" : "Drag to rotate";

  rotateHint.classList.add("show");
  setTimeout(()=>rotateHint.classList.remove("show"),4500);
}

function animate(){
  animId = requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene,camera);
}

function resizeRenderer(){
  if(!renderer) return;
  const w = viewerEl.clientWidth, h = viewerEl.clientHeight;
  renderer.setSize(w,h);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
}

function fitModel(model){
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());

  model.position.sub(center);

  const maxDim = Math.max(size.x,size.y,size.z);
  camera.position.set(0, maxDim*0.8, maxDim*2.0);

  controls.target.set(0,0,0);
  controls.update();
}

closeBtn.addEventListener("click",()=>{
  overlay.classList.remove("open");
  cleanupViewer();
});

function cleanupViewer(){
  if(animId) cancelAnimationFrame(animId);
  if(renderer){
    renderer.dispose();
    renderer.domElement.remove();
  }
  scene = null;
  camera = null;
  controls = null;
  renderer = null;
}
</script>

</body>
</html>
